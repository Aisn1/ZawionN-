
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Heart 💙</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #060208;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

canvas {
    display: block;
}
</style>
</head>

<body>

<canvas id="heart"></canvas>

<script>
(() => {

"use strict";

// AYARLAR

const SC = 21;
const OY = 20;
const DURATION = 10;
const ANIM = 42;
const LIFT = 34;
const GAP = 7;

const SIZES = [9, 10, 11, 12];
const FONT = "Arial";
const BG = "#060208";

const PHRASES = ["Naz"];

const FLASH = [0.65, 0.78, 1.0];

const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

let side = 800;
let scale = 1;
let dpr = 1;

// SABİT RASTGELELİK

const rng = (() => {

    let a = 11;

    return {
        next() {
            a = (a * 1664525 + 1013904223) >>> 0;
            return a / 4294967296;
        },

        uniform(min, max) {
            return min + this.next() * (max - min);
        },

        choice(arr) {
            return arr[Math.floor(this.next() * arr.length)];
        },

        shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(this.next() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
    };

})();

// EKRAN BOYUTU

function resize() {

    side = Math.min(innerWidth, innerHeight);
    dpr = Math.min(devicePixelRatio || 1, 2);

    scale = side / 800;

    canvas.style.width = side + "px";
    canvas.style.height = side + "px";

    canvas.width = Math.round(side * dpr);
    canvas.height = Math.round(side * dpr);
}

addEventListener("resize", resize);

// KALP MATEMATİĞİ

function heart(a) {

    const x = 16 * Math.pow(Math.sin(a), 3);

    const y =
        13 * Math.cos(a)
        - 5 * Math.cos(2 * a)
        - 2 * Math.cos(3 * a)
        - Math.cos(4 * a);

    return [
        x * SC,
        y * SC + OY
    ];
}

const POLY = Array.from(
    { length: 720 },
    (_, i) => heart(2 * Math.PI * i / 720)
);

const EDGES = POLY.map((p, i) => [
    p,
    POLY[(i + 1) % POLY.length]
]);

const YMAX = Math.max(...POLY.map(p => p[1]));
const YMIN = Math.min(...POLY.map(p => p[1]));

const CY = (YMAX + YMIN) / 2;

// KESİŞİM HESAPLARI

function spans(y) {

    const xs = [];

    for (const [[x1, y1], [x2, y2]] of EDGES) {

        if (
            (y1 <= y && y < y2) ||
            (y2 <= y && y < y1)
        ) {

            xs.push(
                x1 + (y - y1) * (x2 - x1) / (y2 - y1)
            );

        }
    }

    xs.sort((a, b) => a - b);

    const out = [];

    for (let i = 0; i + 1 < xs.length; i += 2) {
        out.push([xs[i], xs[i + 1]]);
    }

    return out;
}

function intersect(A, B) {

    const out = [];

    for (const a of A) {
        for (const b of B) {

            const lo = Math.max(a[0], b[0]);
            const hi = Math.min(a[1], b[1]);

            if (hi - lo > 14) {
                out.push([lo, hi]);
            }
        }
    }

    return out;
}

// RENK İŞLEMLERİ

function mix(a, b, k) {

    return a.map(
        (v, i) => v + (b[i] - v) * k
    );
}

function dim(c, k) {
    return c.map(v => v * k);
}

function clamp(v) {
    return Math.max(0, Math.min(1, v));
}

function hex(c) {

    return "#" + c.map(v =>
        Math.round(clamp(v) * 255)
            .toString(16)
            .padStart(2, "0")
    ).join("");

}

function mathDist(x, y) {

    return Math.hypot(
        x / (16 * SC),
        (y - CY) / (14.5 * SC)
    );
}

// YAZI DÖNGÜSÜ

function* phraseCycle() {

    while (true) {

        const order = rng.shuffle(PHRASES.slice());

        for (const phrase of order) {
            yield phrase;
        }
    }
}

// KALBİ OLUŞTUR

function build() {

    const cycle = phraseCycle();

    const rowH = 20;
    const half = rowH / 2;

    const placed = [];

    ctx.font = `bold 12px ${FONT}`;

    for (
        let y = YMAX - half;
        y > YMIN + half;
        y -= rowH
    ) {

        const row = intersect(
            spans(y + half),
            spans(y - half)
        );

        for (const [lo0, hi0] of row) {

            const lo = lo0 + 4;
            const hi = hi0 - 4;

            let cur = lo + rng.uniform(0, 8);

            const line = [];

            while (true) {

                let fit = null;

                for (let i = 0; i < 10; i++) {

                    const text = cycle.next().value;
                    const size = rng.choice(SIZES);

                    ctx.font = `bold ${size}px ${FONT}`;

                    const w = ctx.measureText(text).width;

                    if (cur + w <= hi) {

                        fit = {
                            text,
                            size,
                            w
                        };

                        break;
                    }
                }

                if (!fit) break;

                line.push({

                    x: cur + fit.w / 2,
                    text: fit.text,
                    size: fit.size,
                    w: fit.w

                });

                cur += fit.w + GAP;
            }

            if (!line.length) continue;

            if (line.length > 1) {

                const left =
                    hi - (line[line.length - 1].x +
                    line[line.length - 1].w / 2);

                line.forEach((it, i) => {

                    it.x += left * i / (line.length - 1);

                });

            } else {

                line[0].x = (lo + hi) / 2;

            }

            line.forEach((it, i) => {

                placed.push({

                    ...it,
                    y,
                    edge: i === 0 || i === line.length - 1

                });

            });

        }
    }

    // LACİVERT RENK PALETİ

    const wine = [0.015, 0.025, 0.16];
    const crimson = [0.035, 0.10, 0.38];
    const blood = [0.10, 0.25, 0.65];

    for (const p of placed) {

        const rad = Math.min(
            1,
            mathDist(p.x, p.y)
        );

        let base = mix(
            wine,
            crimson,
            0.25 + 0.75 * rad
        );

        base = mix(
            base,
            blood,
            rng.uniform(0, 0.35) +
            (p.edge ? 0.3 : 0)
        );

        p.color = base.map(v => Math.min(1, v));
        p.rad = rad;

    }

    const edges = placed.filter(p => p.edge);
    const inner = placed.filter(p => !p.edge);

    edges.sort((a, b) =>
        Math.atan2(a.x, a.y - CY) -
        Math.atan2(b.x, b.y - CY)
    );

    inner.sort((a, b) => b.rad - a.rad);

    return edges.concat(inner);
}

// ANİMASYON

const ORDER = build();

let active = [];
let finishedItems = [];

let nextIndex = 0;
let startTime = null;
let shimmerAt = 0;

const BGC = [
    6 / 255,
    2 / 255,
    8 / 255
];

// YAZI ÇİZİMİ

function drawText(p, x, y, color, size = p.size) {

    ctx.font = `bold ${size}px ${FONT}`;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = color;

    // ÖNEMLİ: KALBİ EKRANIN MERKEZİNE TAŞI

    ctx.fillText(
        p.text,
        x + 400,
        y + 400
    );
}

// EKRANI ÇİZ

function draw(now) {

    ctx.setTransform(1, 0, 0, 1, 0, 0);

    ctx.fillStyle = BG;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.setTransform(
        dpr * scale,
        0,
        0,
        dpr * scale,
        0,
        0
    );

    // TAMAMLANAN YAZILAR

    for (const p of finishedItems) {

        const color =
            p.shimmerUntil > now
                ? p.shimmerColor
                : hex(p.color);

        drawText(
            p,
            p.x,
            -p.y,
            color
        );
    }

    // ANİMASYONDAKİ YAZILAR

    for (const p of active) {

        const u = clamp(p.f / ANIM);

        const e = 1 - Math.pow(1 - u, 3);

        const x = p.x + p.dx * (1 - e);

        const y = -p.y - (1 - e) * LIFT;

        // GÖLGE

        drawText(
            p,
            x + 2,
            y + 3,
            hex(mix(
                BGC,
                dim(p.color, 0.30),
                e
            ))
        );

        // HALO

        drawText(
            p,
            x,
            y,
            hex(mix(
                BGC,
                dim(p.color, 0.20),
                e * e
            )),
            p.size + 1
        );

        // PARLAMA

        const flash =
            0.75 * Math.sin(
                Math.PI * clamp((u - 0.55) / 0.45)
            );

        const col = mix(
            mix(
                BGC,
                p.color,
                Math.pow(e, 1.5)
            ),
            FLASH,
            flash
        );

        drawText(
            p,
            x,
            y,
            hex(col)
        );
    }
}

// ANA DÖNGÜ

function frame(now) {

    if (startTime === null) {
        startTime = now;
    }

    const elapsed = now - startTime;

    const rate =
        ORDER.length / (DURATION * 1000);

    const target = Math.min(
        ORDER.length,
        Math.floor(elapsed * rate)
    );

    // YENİ YAZILARI OLUŞTUR

    while (nextIndex < target) {

        const p = ORDER[nextIndex++];

        active.push({

            ...p,
            f: 0,
            dx: rng.uniform(-10, 10)

        });

    }

    // ANİMASYONU İLERLET

    for (let i = active.length - 1; i >= 0; i--) {

        const p = active[i];

        p.f++;

        if (p.f >= ANIM) {

            finishedItems.push({

                ...p,
                shimmerUntil: 0,
                shimmerColor: null

            });

            active.splice(i, 1);

        }
    }

    // PARLAMA EFEKTİ

    if (
        nextIndex >= ORDER.length &&
        active.length === 0 &&
        now >= shimmerAt
    ) {

        if (finishedItems.length) {

            const p = rng.choice(finishedItems);

            p.shimmerUntil = now + 260;

            p.shimmerColor = hex(
                mix(p.color, FLASH, 0.6)
            );

        }

        shimmerAt = now + 140;

    }

    draw(now);

    requestAnimationFrame(frame);
}

// BAŞLAT

resize();

requestAnimationFrame(frame);

})();
</script>

</body>
</html>
